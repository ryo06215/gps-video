<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>位置情報AR動画コンテンツ</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    #status {
      font-size: 1.1rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .video-box {
      margin-top: 10px;
    }
    video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .btn {
      padding: 12px 24px;
      font-size: 1rem;
      background-color: #e91e63;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h2>スポット限定AR体験</h2>
  <p id="status">ボタンを押して探索を開始してください。</p>
  <button id="startBtn" class="btn" onclick="startTracking()">探索をはじめる</button>

  <!-- 探索中動画 -->
  <div id="search-container" class="video-box" style="display: none;">
    <video id="searchVideo" src="loading.mp4" controls playsinline webkit-playsinline loop muted></video>
  </div>

  <!-- 到着時動画 -->
  <div id="arrived-container" class="video-box" style="display: none;">
    <video id="arrivedVideo" src="motto3.MP4" controls playsinline webkit-playsinline></video>
    <br>
    <button id="playBtn" class="btn" style="display: none;" onclick="playArrivedVideo()">タップして動画を再生</button>
  </div>

  <script>
    const TARGETS = [
      { name: "靱公園 バラ園", lat: 34.684556, lng: 135.493099, radius: 100 },
      { name: "創造社デザイン専門学校", lat: 34.688122, lng: 135.493211, radius: 80 }
    ];

    let watchId = null;
    let isArrived = false;

    function getDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function startTracking() {
      const status = document.getElementById("status");
      const startBtn = document.getElementById("startBtn");
      const searchContainer = document.getElementById("search-container");
      const searchVideo = document.getElementById("searchVideo");

      if (!navigator.geolocation) {
        status.innerText = "お使いのブラウザは位置情報に対応していません。";
        return;
      }

      startBtn.style.display = "none";
      searchContainer.style.display = "block";

      // 探索用動画を再生
      searchVideo.play().catch(e => console.log(e));

      status.innerText = "目的地を探しています…（目的地へ向かって移動してください）";

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          if (isArrived) return;

          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;

          let matchedSpot = null;
          for (const target of TARGETS) {
            const distance = getDistance(userLat, userLng, target.lat, target.lng);
            if (distance <= target.radius) {
              matchedSpot = target;
              break;
            }
          }

          if (matchedSpot) {
            isArrived = true;
            status.innerText = `「${matchedSpot.name}」に到着しました！`;
            
            // 探索動画を非表示にして停止
            searchVideo.pause();
            searchContainer.style.display = "none";

            // 到着動画を表示して再生準備
            const arrivedContainer = document.getElementById("arrived-container");
            const arrivedVideo = document.getElementById("arrivedVideo");
            arrivedContainer.style.display = "block";

            arrivedVideo.load();
            const playPromise = arrivedVideo.play();

            if (playPromise !== undefined) {
              playPromise.catch(error => {
                // 自動再生が拒否された場合は手動ボタンを表示
                document.getElementById("playBtn").style.display = "inline-block";
              });
            }

            if (watchId !== null) {
              navigator.geolocation.clearWatch(watchId);
            }
          }
        },
        (error) => {
          status.innerText = "位置情報の取得に失敗しました。";
        },
        { enableHighAccuracy: true, maximumAge: 0 }
      );
    }

    function playArrivedVideo() {
      const arrivedVideo = document.getElementById("arrivedVideo");
      const playBtn = document.getElementById("playBtn");
      arrivedVideo.play();
      playBtn.style.display = "none";
    }
  </script>
</body>
</html>
