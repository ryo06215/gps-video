<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>位置情報AR動画コンテンツ</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    #status {
      font-size: 1.1rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .video-box {
      margin-top: 10px;
    }
    /* 縦型動画（Shorts）にも適した動画プレイヤー表示枠 */
    iframe {
      width: 100%;
      max-width: 360px;
      height: 640px;
      max-height: 70vh;
      border-radius: 12px;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .btn {
      padding: 12px 24px;
      font-size: 1rem;
      background-color: #e91e63;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h2>スポット限定AR体験</h2>
  <p id="status">ボタンを押して探索を開始してください。</p>
  <button id="startBtn" class="btn" onclick="startTracking()">探索をはじめる</button>

  <!-- 探索中動画（YouTube埋め込み） -->
  <div id="searchBox" class="video-box" style="display: none;">
    <iframe id="searchIframe" src="https://www.youtube.com/embed/hYDcZNlnIqg?autoplay=1&mute=1&loop=1&playlist=hYDcZNlnIqg&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

  <!-- 到着時メイン動画（YouTube埋め込み） -->
  <div id="arrivedBox" class="video-box" style="display: none;">
    <iframe id="arrivedIframe" src="https://www.youtube.com/embed/c-ZiSgN467s?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

  <script>
    // 目的地の座標設定
    const TARGETS = [
      { name: "靱公園 バラ園", lat: 34.684556, lng: 135.493099, radius: 100 },
      { name: "創造社デザイン専門学校", lat: 34.688122, lng: 135.493211, radius: 80 }
    ];

    let watchId = null;
    let isArrived = false;

    // 2点間の距離(m)計算関数
    function getDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function startTracking() {
      const status = document.getElementById("status");
      const startBtn = document.getElementById("startBtn");
      const searchBox = document.getElementById("searchBox");

      if (!navigator.geolocation) {
        status.innerText = "お使いのブラウザは位置情報に対応していません。";
        return;
      }

      startBtn.style.display = "none";
      searchBox.style.display = "block";

      status.innerText = "目的地を探しています…（目的地へ向かって移動してください）";

      // リアルタイム位置情報の監視を開始
      watchId = navigator.geolocation.watchPosition(
        (position) => {
          if (isArrived) return;

          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;

          let matchedSpot = null;
          for (const target of TARGETS) {
            const distance = getDistance(userLat, userLng, target.lat, target.lng);
            if (distance <= target.radius) {
              matchedSpot = target;
              break;
            }
          }

          // 目的地に到着した時の処理
          if (matchedSpot) {
            isArrived = true;
            status.innerText = `「${matchedSpot.name}」に到着しました！`;
            
            // 探索用動画を隠し、メイン動画を表示
            searchBox.style.display = "none";
            document.getElementById("arrivedBox").style.display = "block";

            // GPS追跡を停止
            if (watchId !== null) {
              navigator.geolocation.clearWatch(watchId);
            }
          }
        },
        (error) => {
          status.innerText = "位置情報の取得に失敗しました。設定で位置情報を許可してください。";
        },
        { enableHighAccuracy: true, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
