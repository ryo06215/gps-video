<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>位置情報AR動画コンテンツ</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    #status {
      font-size: 1.1rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    #video-container {
      margin-top: 10px;
    }
    video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .btn {
      padding: 12px 24px;
      font-size: 1rem;
      background-color: #e91e63;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>スポット限定AR体験</h2>
  <p id="status">ボタンを押して探索を開始してください。</p>
  <button id="startBtn" class="btn" onclick="startTracking()">探索をはじめる</button>

  <div id="video-container" style="display: none;">
    <video id="myVideo" controls playsinline></video>
  </div>

  <script>
    // GitHubにアップロードしたファイル名に合わせて変更してください
    const SEARCHING_VIDEO = "loading.mp4"; 
    const ARRIVED_VIDEO = "motto3.mp4";

    // 目的地の座標（靱公園 バラ園 / 創造社デザイン専門学校）
    const TARGETS = [
      { name: "靱公園 バラ園", lat: 34.684556, lng: 135.493099, radius: 100 },
      { name: "創造社デザイン専門学校", lat: 34.688122, lng: 135.493211, radius: 80 }
    ];

    let watchId = null;
    let isArrived = false;

    function getDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function startTracking() {
      const status = document.getElementById("status");
      const startBtn = document.getElementById("startBtn");
      const videoContainer = document.getElementById("video-container");
      const video = document.getElementById("myVideo");

      if (!navigator.geolocation) {
        status.innerText = "お使いのブラウザは位置情報に対応していません。";
        return;
      }

      startBtn.style.display = "none";
      videoContainer.style.display = "block";

      // 探索中は探している最中の動画をループ再生
      video.src = SEARCHING_VIDEO;
      video.loop = true;
      video.play();

      status.innerText = "目的地を探しています…（目的地へ向かって移動してください）";

      // 位置情報のリアルタイム追跡を開始
      watchId = navigator.geolocation.watchPosition(
        (position) => {
          if (isArrived) return;

          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;

          let matchedSpot = null;
          for (const target of TARGETS) {
            const distance = getDistance(userLat, userLng, target.lat, target.lng);
            if (distance <= target.radius) {
              matchedSpot = target;
              break;
            }
          }

          // 到着時の処理
          if (matchedSpot) {
            isArrived = true;
            status.innerText = `「${matchedSpot.name}」に到着しました！`;
            
            // ループ解除＆到着動画に切替
            video.pause();
            video.src = ARRIVED_VIDEO;
            video.loop = false;
            video.load();
            video.play();

            if (watchId !== null) {
              navigator.geolocation.clearWatch(watchId);
            }
          }
        },
        (error) => {
          status.innerText = "位置情報の取得に失敗しました。ブラウザの位置情報許可をご確認ください。";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
